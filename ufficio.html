<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icona-180.png">
<title>Ufficio 3D · Leoni Studio</title>
<style>
:root{--bg:#0d1117;--panel:rgba(18,23,31,.86);--line:rgba(255,255,255,.12);--txt:#e6edf3;--mut:#8b949e;--acc:#f5b301;--ok:#3fb950;--err:#f85149}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#2a3350 0%,#161b2b 55%,#0b0e16 100%);color:var(--txt);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
header{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;pointer-events:none}
header>*{pointer-events:auto}
.logo{font-weight:800;letter-spacing:.06em;font-size:15px;margin-right:auto;text-shadow:0 1px 8px #000}
.logo b{color:var(--acc)}
.pill{padding:5px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:12.5px;backdrop-filter:blur(8px);white-space:nowrap}
.pill.ok{color:var(--ok)}.pill.err{color:var(--err)}
button,a.btn{font:inherit;color:var(--txt);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;backdrop-filter:blur(8px);text-decoration:none;display:inline-block}
button:hover,a.btn:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:#111;border-color:var(--acc);font-weight:700}
#etichette{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.et{position:absolute;left:0;top:0;transform:translate(-50%,-100%);padding:4px 9px;border-radius:10px;background:rgba(13,17,23,.78);border:1px solid var(--line);font-size:12px;white-space:nowrap;max-width:230px;text-align:center;will-change:transform;transition:opacity .25s}
.et b{display:block;font-size:12.5px}
.et span{display:block;color:var(--mut);overflow:hidden;text-overflow:ellipsis;font-size:11.5px}
.et.lavora{border-color:var(--col,#58a6ff)}.et.lavora b::before{content:"● ";color:var(--col,#58a6ff);animation:batte 1.1s infinite}
.et.lavora span{color:#dbe4ee}
.et.errore{border-color:var(--err);background:rgba(70,14,14,.88)}.et.errore span{color:#ffb4ae}
.et.libero{opacity:.55}
@keyframes batte{50%{opacity:.25}}
#scheda{position:fixed;z-index:6;right:12px;top:calc(58px + env(safe-area-inset-top));width:min(360px,calc(100vw - 24px));max-height:calc(100vh - 80px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;backdrop-filter:blur(14px);transform:translateX(calc(100% + 24px));transition:transform .35s cubic-bezier(.2,.8,.2,1)}
#scheda.su{transform:none}
#scheda h2{margin:0 0 2px;font-size:19px}
#scheda .ruolo{color:var(--mut);font-size:13px;margin-bottom:10px}
#scheda .x{position:absolute;right:10px;top:10px;padding:4px 10px;border-radius:8px}
.chip{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;background:#1c2633;color:var(--mut)}
.chip.lavora{background:rgba(63,185,80,.18);color:var(--ok)}.chip.errore{background:rgba(248,81,73,.2);color:var(--err)}
.cosa{font-size:15.5px;margin:10px 0 6px}
.barra{height:9px;border-radius:9px;background:#1c2633;overflow:hidden;margin:6px 0}
.barra i{display:block;height:100%;background:var(--acc);border-radius:9px;transition:width .6s}
.mut{color:var(--mut);font-size:12.5px}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:16px 0 6px}
.riga{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px}
.riga span:last-child{color:var(--mut);white-space:nowrap}
.riga.err span:first-child{color:#ffb4ae}
.dati{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dato{background:rgba(255,255,255,.05);border-radius:10px;padding:8px 10px}
.dato b{display:block;font-size:19px}.dato small{color:var(--mut)}
.azioni{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
#login{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;place-items:center}
#login form{width:min(360px,90vw);background:#12171f;border:1px solid var(--line);border-radius:16px;padding:26px;display:flex;flex-direction:column;gap:12px}
#login input{padding:12px;border-radius:10px;border:1px solid var(--line);background:#0a0e13;color:var(--txt);font:inherit;font-size:16px}
#avviso{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:7;padding:9px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:13px;max-width:92vw;text-align:center;backdrop-filter:blur(8px);transition:opacity .4s}
#carica{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:var(--bg);font-size:16px;transition:opacity .5s}
@media (max-width:640px){
 #scheda{right:0;left:0;top:auto;bottom:0;width:100%;max-height:52vh;border-radius:18px 18px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom));transform:translateY(105%)}
 .et{font-size:11px;padding:3px 7px}.et span{display:none}.et.errore span{display:block;max-width:120px}
 .logo{font-size:13px}
}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="etichette"></div>
<header>
 <div class="logo">LEONI <b>STUDIO</b> · Ufficio 3D</div>
 <span id="pc" class="pill">PC: —</span>
 <a id="bApp" class="btn" href="./" style="display:none">← App</a>
 <button id="bRegistro">Registro</button>
 <button id="bGenerale" class="pri">Vista generale</button>
</header>
<aside id="scheda"></aside>

<div id="login"><form id="lgForm"><div class="logo" style="text-align:center;font-size:20px;margin:0">LEONI <b>STUDIO</b></div>
 <input id="lg_email" type="email" placeholder="Email" autocomplete="username" required><input id="lg_pw" type="password" placeholder="Password" autocomplete="current-password" required>
 <button class="pri">Entra</button><div id="lg_err" style="color:var(--err);min-height:20px;text-align:center"></div></form></div>
<div id="carica">Apro l'ufficio…</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

/* ============================================================
   UFFICIO 3D DEGLI AGENTI - Leoni Studio
   Stesso file in locale (http://127.0.0.1:8197, dati da /api/ufficio)
   e online dentro l'app Leoni Studio (dati da Supabase, chiave leoni_ufficio).
   ============================================================ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(location.protocol==='file:')location.replace('http://127.0.0.1:8197/');
const LOCALE=['127.0.0.1','localhost'].includes(location.hostname);
const DEMO=new URLSearchParams(location.search).has('demo');
const TOUCH=matchMedia('(pointer:coarse)').matches;
const V3=THREE.Vector3;

// ---------- renderer / scena ----------
const canvas=$('#c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:!TOUCH,alpha:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,TOUCH?1.5:2));
renderer.setClearAlpha(0);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.shadowMap.autoUpdate=false;
const scene=new THREE.Scene();
const pm=new THREE.PMREMGenerator(renderer);scene.environment=pm.fromScene(new RoomEnvironment(),.04).texture;scene.environmentIntensity=.35;
const camera=new THREE.PerspectiveCamera(36,1,.3,220);
const controls=new OrbitControls(camera,canvas);
Object.assign(controls,{enableDamping:true,dampingFactor:.08,maxPolarAngle:1.47,minDistance:2.5,maxDistance:85,zoomSpeed:.9,rotateSpeed:.7,panSpeed:.8});
controls.touches={ONE:THREE.TOUCH.ROTATE,TWO:THREE.TOUCH.DOLLY_PAN};

// ---------- texture disegnate (niente file esterni) ----------
function tela(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;return t}
function rnd(seed){let s=seed;return()=>(s=(s*16807)%2147483647)/2147483647}
function legno(base,scuro,doghe,seed=7){return tela(512,512,(x,w,h)=>{const r=rnd(seed);x.fillStyle=base;x.fillRect(0,0,w,h);const dh=h/doghe;
 for(let i=0;i<doghe;i++){x.fillStyle=`rgba(${r()>.5?'255,220,170':'70,35,10'},${.05+r()*.12})`;x.fillRect(0,i*dh,w,dh);
  for(let k=0;k<26;k++){x.strokeStyle=`rgba(60,30,10,${.04+r()*.1})`;x.lineWidth=.6+r()*1.6;x.beginPath();const y=i*dh+r()*dh;x.moveTo(0,y);x.bezierCurveTo(w*.3,y+r()*8-4,w*.6,y+r()*8-4,w,y+r()*6-3);x.stroke()}
  x.fillStyle=scuro;x.fillRect(0,i*dh,w,2);const g=(r()*w)|0;x.fillRect(g,i*dh,2,dh)}})}
const T={
 legnoPalco:legno('#b9703f','rgba(50,22,8,.75)',8,11),
 legnoTavolo:legno('#c98d55','rgba(80,40,15,.25)',3,5),
 legnoScuro:legno('#8a4f2a','rgba(40,18,6,.6)',4,9),
 cemento:tela(1024,1024,(x,w,h)=>{const r=rnd(3);x.fillStyle='#7d7f86';x.fillRect(0,0,w,h);
  for(let i=0;i<900;i++){const a=r()*.035,s=20+r()*120;x.fillStyle=r()>.5?`rgba(255,255,255,${a})`:`rgba(20,22,30,${a})`;x.beginPath();x.ellipse(r()*w,r()*h,s,s*(.4+r()*.6),r()*3,0,7);x.fill()}
  for(let i=0;i<5000;i++){x.fillStyle=`rgba(${r()>.5?255:0},${r()>.5?255:0},${r()>.5?255:0},.05)`;x.fillRect(r()*w,r()*h,2,2)}
  x.strokeStyle='rgba(30,32,38,.35)';x.lineWidth=3;for(let i=1;i<4;i++){x.beginPath();x.moveTo(i*w/4,0);x.lineTo(i*w/4,h);x.stroke();x.beginPath();x.moveTo(0,i*h/4);x.lineTo(w,i*h/4);x.stroke()}}),
};
for(const k of ['legnoPalco','legnoTavolo','legnoScuro','cemento']){T[k].wrapS=T[k].wrapT=THREE.RepeatWrapping}
T.cemento.repeat.set(3,3);T.legnoPalco.repeat.set(3,2);

// ---------- materiali condivisi ----------
const M={
 pavimento:new THREE.MeshStandardMaterial({map:T.cemento,roughness:.55,metalness:.05}),
 muro:new THREE.MeshStandardMaterial({color:0xe9dccd,roughness:.95}),
 battiscopa:new THREE.MeshStandardMaterial({color:0x8a4f2a,roughness:.6}),
 palco:new THREE.MeshStandardMaterial({map:T.legnoPalco,roughness:.45}),
 tavolo:new THREE.MeshStandardMaterial({map:T.legnoTavolo,roughness:.5}),
 legnoScuro:new THREE.MeshStandardMaterial({map:T.legnoScuro,roughness:.6}),
 metallo:new THREE.MeshStandardMaterial({color:0xb8bcc4,roughness:.35,metalness:.9}),
 metalloScuro:new THREE.MeshStandardMaterial({color:0x2a2d33,roughness:.45,metalness:.8}),
 plasticaNera:new THREE.MeshStandardMaterial({color:0x15171b,roughness:.4,metalness:.2}),
 cassettiera:new THREE.MeshStandardMaterial({color:0xd9dade,roughness:.6,metalness:.2}),
 tessuto:new THREE.MeshStandardMaterial({color:0x3f5f9e,roughness:1}),
 robot:new THREE.MeshPhysicalMaterial({color:0xf4f6f8,roughness:.28,clearcoat:.6,clearcoatRoughness:.25}),
 giunto:new THREE.MeshStandardMaterial({color:0x2b2f36,roughness:.5,metalness:.4}),
 visiera:new THREE.MeshPhysicalMaterial({color:0x06080c,roughness:.12,clearcoat:1}),
 vaso:new THREE.MeshStandardMaterial({color:0xb5623a,roughness:.8}),
 foglia:new THREE.MeshStandardMaterial({color:0x3f8f3a,roughness:.7,side:THREE.DoubleSide}),
 foglia2:new THREE.MeshStandardMaterial({color:0x5fae45,roughness:.7,side:THREE.DoubleSide}),
 lampada:new THREE.MeshStandardMaterial({color:0x8a5a48,roughness:.5,metalness:.3,side:THREE.DoubleSide}),
 bulbo:new THREE.MeshBasicMaterial({color:0xffe2ae}),
 vetro:new THREE.MeshPhysicalMaterial({color:0xbfe6ff,roughness:.05,transmission:.9,thickness:.2,transparent:true,opacity:.5}),
};
const G={
 box:new THREE.BoxGeometry(1,1,1),
 cil:new THREE.CylinderGeometry(1,1,1,20),
 sfera:new THREE.SphereGeometry(1,28,20),
};
function mesh(g,m,x=0,y=0,z=0,sx=1,sy=1,sz=1,ombra=true){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=ombra;o.receiveShadow=true;return o}
const box=(m,x,y,z,sx,sy,sz,o)=>mesh(G.box,m,x,y,z,sx,sy,sz,o);
const cil=(m,x,y,z,r,h,o)=>mesh(G.cil,m,x,y,z,r,h,r,o);
const rbox=(w,h,d,r,m)=>{const o=new THREE.Mesh(new RoundedBoxGeometry(w,h,d,3,r),m);o.castShadow=o.receiveShadow=true;return o};

// ---------- stanza ----------
const ST={W:32,ZDIETRO:-11.5,ZDAVANTI:14,H:9};
const stanza=new THREE.Group();scene.add(stanza);
let pavimento,muroSx,muroDx;
function faiStanza(){
 stanza.clear();
 const L=ST.ZDAVANTI-ST.ZDIETRO,zc=(ST.ZDAVANTI+ST.ZDIETRO)/2,hw=ST.W/2;
 pavimento=box(M.pavimento,0,-.25,zc,ST.W,.5,L,false);stanza.add(pavimento);
 const piano=(w,h,x,y,z,ry)=>{const p=new THREE.Mesh(new THREE.PlaneGeometry(w,h),M.muro);p.position.set(x,y,z);p.rotation.y=ry;p.receiveShadow=true;stanza.add(p);return p};
 piano(ST.W,ST.H,0,ST.H/2,ST.ZDIETRO,0);
 muroSx=piano(L,ST.H,-hw,ST.H/2,zc,Math.PI/2);muroDx=piano(L,ST.H,hw,ST.H/2,zc,-Math.PI/2);
 stanza.add(box(M.battiscopa,0,.18,ST.ZDIETRO+.05,ST.W,.36,.1,false),box(M.battiscopa,-hw+.05,.18,zc,.1,.36,L,false),box(M.battiscopa,hw-.05,.18,zc,.1,.36,L,false));
 // bordo superiore dei muri (spessore finto, come un plastico)
 const bordo=new THREE.MeshStandardMaterial({color:0xcfc2b2,roughness:.9});
 stanza.add(box(bordo,0,ST.H+.06,ST.ZDIETRO-.15,ST.W+.6,.12,.3,false),box(bordo,-hw-.15,ST.H+.06,zc,.3,.12,L,false),box(bordo,hw+.15,ST.H+.06,zc,.3,.12,L,false));
}

// ---------- luci ----------
scene.add(new THREE.HemisphereLight(0xfff0dc,0x3b3548,.75));
const sole=new THREE.DirectionalLight(0xffe0b8,2.3);sole.position.set(9,22,13);sole.castShadow=true;
sole.shadow.mapSize.set(TOUCH?1024:2048,TOUCH?1024:2048);Object.assign(sole.shadow.camera,{left:-21,right:21,top:22,bottom:-22,near:1,far:70});sole.shadow.bias=-.0004;sole.shadow.normalBias=.03;sole.shadow.radius=4;
scene.add(sole,sole.target);
function lampada(x,z,luce){const g=new THREE.Group();g.position.set(x,0,z);
 g.add(cil(M.plasticaNera,0,ST.H+1.5,0,.02,6,false));
 const cap=new THREE.Mesh(new THREE.ConeGeometry(.55,.42,24,1,true),M.lampada);cap.position.y=7.5;g.add(cap);
 const b=new THREE.Mesh(G.sfera,M.bulbo);b.scale.setScalar(.2);b.position.y=7.32;g.add(b);
 const alone=new THREE.Sprite(new THREE.SpriteMaterial({map:T.alone,color:0xffd9a0,transparent:true,opacity:.55,depthWrite:false,blending:THREE.AdditiveBlending}));alone.scale.setScalar(3.2);alone.position.y=7.25;g.add(alone);
 if(luce){const p=new THREE.PointLight(0xffc98a,90,20,1.9);p.position.y=7.0;g.add(p)}
 scene.add(g)}
T.alone=tela(128,128,(x,w)=>{const g=x.createRadialGradient(w/2,w/2,0,w/2,w/2,w/2);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.25,'rgba(255,230,180,.5)');g.addColorStop(1,'rgba(255,200,120,0)');x.fillStyle=g;x.fillRect(0,0,w,w)});

// ---------- arredo ----------
function pianta(x,z,s=1,parent=scene,y=0){const g=new THREE.Group();g.position.set(x,y,z);g.scale.setScalar(s);
 const v=new THREE.Mesh(new THREE.CylinderGeometry(.42,.3,.6,18),M.vaso);v.position.y=.3;v.castShadow=true;g.add(v);
 const fg=new THREE.SphereGeometry(1,8,6);
 for(let i=0;i<9;i++){const f=new THREE.Mesh(fg,i%2?M.foglia:M.foglia2);const a=i/9*6.283+(i%3)*.3,inc=.35+(i%3)*.28;f.scale.set(.2,.03,.62+(i%4)*.12);
  f.position.set(Math.sin(a)*.42*Math.sin(inc+.4),.95+Math.cos(inc)*.55,Math.cos(a)*.42*Math.sin(inc+.4));f.rotation.set(-inc-.3,a,0,'YXZ');f.castShadow=true;g.add(f)}
 parent.add(g);return g}
function libreria(x,z,ry){const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=ry;const W=3.2,H=3.6,D=.85;
 g.add(box(M.legnoScuro,0,H/2,-D/2+.04,W,H,.08),box(M.legnoScuro,-W/2,H/2,0,.1,H,D),box(M.legnoScuro,W/2,H/2,0,.1,H,D),box(M.legnoScuro,0,H/2,0,.08,H,D));
 const col=[0xb94a48,0x3a6ea5,0xe0c068,0x4f8a5b,0xd9d4c7,0x7a5195,0xe07a3f,0x2f4858];const r=rnd(Math.abs(x*31+z*7)|0||5);
 for(let i=0;i<=4;i++){const y=.06+i*(H-.12)/4;g.add(box(M.legnoScuro,0,y,0,W,.09,D));if(i==4)break;
  for(const lato of [-1,1]){let px=lato<0?-W/2+.2:.14;const fine=px+W/2-.42;while(px<fine-.15){const w=.09+r()*.09,h=.45+r()*.28;if(r()<.16){px+=.22;continue}
   const b=box(new THREE.MeshStandardMaterial({color:col[(r()*col.length)|0],roughness:.8}),px+w/2,y+.05+h/2,.02,w,h,.5,false);g.add(b);px+=w+.012}}}
 pianta(-W/4,0,.55,g,H+.02);scene.add(g)}

// ---------- palco con 3 scalini + LED wall ----------
const PALCO={y:1.05,z:-7.6};
function faiPalco(){
 const g=new THREE.Group();const zb=ST.ZDIETRO+.02;
 [[13.6,7.6],[12.2,6.9],[10.8,6.2]].forEach(([w,d],i)=>{
  const sh=new THREE.Shape();const c=1.1;sh.moveTo(-w/2,0);sh.lineTo(w/2,0);sh.lineTo(w/2,d-c);sh.lineTo(w/2-c,d);sh.lineTo(-w/2+c,d);sh.lineTo(-w/2,d-c);sh.closePath();
  const geo=new THREE.ExtrudeGeometry(sh,{depth:.35,bevelEnabled:true,bevelSize:.03,bevelThickness:.03,bevelSegments:2});
  // UV in metri per le doghe
  const uv=geo.attributes.uv;for(let k=0;k<uv.count;k++)uv.setXY(k,uv.getX(k)/5,uv.getY(k)/5);
  const m=new THREE.Mesh(geo,M.palco);m.rotation.x=-Math.PI/2;m.position.set(0,i*.35,zb);m.rotation.z=0;m.scale.y=-1;m.castShadow=m.receiveShadow=true;
  // scale.y=-1 ribalta: l'estrusione parte dal muro e viene verso la stanza
  m.material=M.palco.clone();m.material.side=THREE.DoubleSide;g.add(m)});
 scene.add(g);
 // LED wall
 const lw=13.4,lh=4.83;
 const cornice=rbox(lw+.4,lh+.4,.28,.08,M.plasticaNera);cornice.position.set(0,5.75,ST.ZDIETRO+.16);scene.add(cornice);
 LED.tex=tela(1664,600,()=>{});LED.tex.anisotropy=8;
 const sch=new THREE.Mesh(new THREE.PlaneGeometry(lw,lh),new THREE.MeshBasicMaterial({map:LED.tex,toneMapped:false}));sch.position.set(0,5.75,ST.ZDIETRO+.31);scene.add(sch);
 const bagliore=new THREE.PointLight(0x66b8ff,26,13,2);bagliore.position.set(0,5.4,ST.ZDIETRO+2.2);scene.add(bagliore);LED.luce=bagliore;
}
const LED={tex:null,luce:null};

// ---------- oggetti che dicono cosa fa l'agente ----------
function oggetto(tipo,colore){const g=new THREE.Group();const mc=new THREE.MeshStandardMaterial({color:colore,roughness:.35,metalness:.3,emissive:colore,emissiveIntensity:.12});
 const tor=(R,r,m=mc,arc=6.2832)=>{const o=new THREE.Mesh(new THREE.TorusGeometry(R,r,10,28,arc),m);o.castShadow=true;return o};
 if(tipo==='forbici'){for(const s of [-1,1]){const l=box(M.metallo,0,.34,0,.05,.6,.02);l.rotation.z=s*.28;l.position.x=s*.02;g.add(l);const a=tor(.11,.03);a.position.set(s*.15,.02,0);g.add(a)}}
 else if(tipo==='cuffie'){const a=tor(.3,.035,M.plasticaNera,Math.PI);a.position.y=.3;g.add(a);for(const s of [-1,1]){const p=cil(mc,s*.3,.26,0,.13,.1);p.rotation.z=Math.PI/2;g.add(p)}}
 else if(tipo==='microfono'){g.add(cil(M.metalloScuro,0,.03,0,.17,.05),cil(M.metallo,0,.3,0,.022,.5));const t=mesh(G.sfera,mc,0,.62,0,.12,.16,.12);g.add(t,cil(M.metalloScuro,0,.5,0,.07,.1))}
 else if(tipo==='fumetto'){const b=rbox(.62,.4,.1,.08,mc);b.position.y=.42;g.add(b);const c=new THREE.Mesh(new THREE.ConeGeometry(.08,.2,4),mc);c.position.set(-.14,.14,0);c.rotation.z=Math.PI;g.add(c);
  for(let i=0;i<3;i++)g.add(box(new THREE.MeshBasicMaterial({color:0xffffff}),i==2?-.07:0,.5-i*.09,.055,i==2?.28:.42,.04,.01,false))}
 else if(tipo==='mirino'){const a=tor(.24,.03);a.position.y=.36;g.add(a);g.add(box(mc,0,.36,0,.66,.035,.035),box(mc,0,.36,0,.035,.66,.035));const p=mesh(G.sfera,new THREE.MeshBasicMaterial({color:0xff3b30}),0,.36,0,.05,.05,.05,false);g.add(p)}
 else if(tipo==='pennello'){const t=cil(M.tavolo,0,.03,0,.3,.04);t.scale.z=.22;g.add(t);[0xff3b30,0xffcc00,0x34c759,0x0a84ff,0xbf5af2].forEach((c,i)=>g.add(mesh(G.sfera,new THREE.MeshStandardMaterial({color:c,roughness:.3}),Math.cos(i*1.1-.6)*.18,.06,Math.sin(i*1.1-.6)*.13,.045,.025,.045,false)));
  const m=cil(M.legnoScuro,.2,.3,0,.02,.5);m.rotation.z=-.5;g.add(m);const p=mesh(G.sfera,mc,.34,.53,0,.045,.09,.045);p.rotation.z=-.5;g.add(p)}
 else if(tipo==='bacchetta'){const m=cil(M.plasticaNera,0,.28,0,.02,.5);m.rotation.z=.4;g.add(m);const s=new THREE.Mesh(new THREE.OctahedronGeometry(.13),new THREE.MeshBasicMaterial({color:colore}));s.position.set(-.12,.58,0);g.add(s);g.userData.gira=s}
 else if(tipo==='cinepresa'){const c=rbox(.46,.3,.22,.04,M.plasticaNera);c.position.y=.24;g.add(c);for(const s of [-1,1]){const r=cil(mc,s*.13,.5,0,.13,.07);r.rotation.x=Math.PI/2;g.add(r)}const l=cil(M.metallo,.32,.24,0,.08,.2);l.rotation.z=Math.PI/2;g.add(l)}
 else if(tipo==='lente'){const a=tor(.2,.03);a.position.y=.42;g.add(a);const v=cil(M.vetro,0,.42,0,.19,.02,false);v.rotation.x=Math.PI/2;g.add(v);const m=cil(M.legnoScuro,.2,.14,0,.03,.3);m.rotation.z=.75;g.add(m)}
 else{const a=tor(.12,.035);a.position.y=.5;g.add(a,box(mc,0,.22,0,.06,.4,.04))}
 return g}

// ---------- robot ----------
function faiRobot(colore,scala=1){
 const g=new THREE.Group();const col=new THREE.Color(colore);
 const mc=new THREE.MeshStandardMaterial({color:col,roughness:.35,metalness:.2});
 const occhi=new THREE.MeshBasicMaterial({color:0x35d6ff});
 const corpo=new THREE.Mesh(new THREE.CapsuleGeometry(.36,.34,6,18),M.robot);corpo.position.y=.52;corpo.castShadow=true;g.add(corpo);
 const petto=rbox(.26,.12,.05,.02,mc);petto.position.set(0,.66,.34);g.add(petto);
 g.add(cil(M.giunto,0,.98,0,.13,.12));
 const testa=new THREE.Group();testa.position.y=1.36;g.add(testa);
 const cranio=mesh(G.sfera,M.robot,0,0,0,.46,.4,.43);testa.add(cranio);
 const vis=new THREE.Mesh(new THREE.SphereGeometry(1,28,16,Math.PI*.5-1.0,2.0,Math.PI*.5-.52,1.0),M.visiera);vis.scale.set(.475,.41,.445);testa.add(vis);
 const og=new THREE.CapsuleGeometry(.045,.07,4,10);
 for(const s of [-1,1]){const o=new THREE.Mesh(og,occhi);o.position.set(s*.15,0,.43);testa.add(o);
  const e=cil(mc,s*.46,0,0,.11,.08);e.rotation.z=Math.PI/2;testa.add(e)}
 const ant=cil(M.giunto,0,.44,0,.012,.14,false);testa.add(ant);const pal=mesh(G.sfera,occhi,0,.53,0,.035,.035,.035,false);testa.add(pal);
 const braccia=[];
 for(const s of [-1,1]){const sp=new THREE.Group();sp.position.set(s*.4,.78,.02);g.add(sp);
  sp.add(mesh(G.sfera,M.giunto,0,0,0,.09,.09,.09));
  const b=new THREE.Mesh(new THREE.CapsuleGeometry(.075,.34,4,10),M.robot);b.position.y=-.24;b.castShadow=true;sp.add(b);
  const gom=new THREE.Group();gom.position.y=-.46;sp.add(gom);
  const av=new THREE.Mesh(new THREE.CapsuleGeometry(.07,.3,4,10),M.robot);av.position.y=-.2;av.castShadow=true;gom.add(av);
  gom.add(mesh(G.sfera,M.giunto,0,-.42,0,.085,.085,.085));
  sp.rotation.set(-.55,0,s*.12);gom.rotation.x=-1.05;braccia.push({sp,gom,s})}
 for(const s of [-1,1]){const c=new THREE.Mesh(new THREE.CapsuleGeometry(.1,.3,4,10),M.robot);c.position.set(s*.17,.14,.3);c.rotation.x=Math.PI/2;c.castShadow=true;g.add(c);
  g.add(mesh(G.sfera,M.giunto,s*.17,-.08,.52,.11,.2,.13))}
 g.scale.setScalar(scala);
 g.userData={testa,braccia,occhi,corpo,fase:Math.random()*10};
 return g}

function monitor(sc){const g=new THREE.Group();
 g.add(cil(M.plasticaNera,0,.015,0,.2,.03),cil(M.plasticaNera,0,.25,-.03,.03,.5));
 const p=rbox(1.3,.8,.06,.02,M.plasticaNera);p.position.y=.72;g.add(p);
 const s=new THREE.Mesh(new THREE.PlaneGeometry(1.22,.72),new THREE.MeshBasicMaterial({map:sc.t,toneMapped:false}));s.position.set(0,.72,.032);g.add(s);return g}
function sedia(){const g=new THREE.Group();
 const s=rbox(.92,.14,.9,.06,M.tessuto);s.position.y=.6;g.add(s);
 const b=rbox(.86,.95,.13,.06,M.tessuto);b.position.set(0,1.2,.46);b.rotation.x=.1;g.add(b);
 g.add(cil(M.metalloScuro,0,.32,0,.045,.5),box(M.metalloScuro,0,.72,.42,.08,.4,.05));
 for(let i=0;i<5;i++){const a=i/5*6.283;const r=box(M.metalloScuro,Math.sin(a)*.25,.08,Math.cos(a)*.25,.07,.05,.5);r.rotation.y=a;g.add(r);g.add(mesh(G.sfera,M.plasticaNera,Math.sin(a)*.48,.05,Math.cos(a)*.48,.055,.055,.055))}
 for(const k of [-1,1])g.add(box(M.plasticaNera,k*.5,.82,.1,.07,.05,.5),box(M.metalloScuro,k*.5,.7,.25,.04,.22,.04));
 return g}
function faiScrivania(opt){ // il robot guarda verso -z (verso i monitor)
 const g=new THREE.Group();const W=opt.grande?3.9:3.1,D=1.55,H=1.0;
 const top=rbox(W,.1,D,.03,M.tavolo);top.position.y=H;g.add(top);
 for(const sx of [-1,1])for(const sz of [-1,1])g.add(box(M.metallo,sx*(W/2-.1),H/2-.03,sz*(D/2-.1),.07,H-.06,.07));
 g.add(box(M.metallo,0,H-.1,-D/2+.1,W-.2,.05,.05),box(M.metallo,0,H-.1,D/2-.1,W-.2,.05,.05));
 if(opt.grande){g.add(box(M.cassettiera,0,H/2-.02,-D/2+.12,W-.3,H-.2,.06))}
 const cs=box(M.cassettiera,-W/2+.45,.37,-.1,.6,.7,.9);g.add(cs);for(let i=0;i<3;i++)g.add(box(M.metalloScuro,-W/2+.45,.14+i*.23,.36,.3,.02,.02,false));
 const s1=schermo(),s2=schermo();
 const m1=monitor(s1);m1.position.set(-.68,H+.05,-.42);m1.rotation.y=.2;g.add(m1);
 const m2=monitor(s2);m2.position.set(.68,H+.05,-.42);m2.rotation.y=-.2;g.add(m2);
 const tast=rbox(.82,.035,.27,.012,M.plasticaNera);tast.position.set(-.05,H+.07,.2);g.add(tast);
 g.add(mesh(G.sfera,M.plasticaNera,.58,H+.07,.22,.055,.03,.085));
 const tazza=cil(new THREE.MeshStandardMaterial({color:opt.colore,roughness:.5}),W/2-.5,H+.14,.42,.075,.17);g.add(tazza);
 pianta(-W/2+.32,.25,.27,g,H+.05);
 const sd=sedia();sd.position.set(0,0,1.12);g.add(sd);
 let robot=null,prop=null;
 if(!opt.libero){robot=faiRobot(opt.colore,opt.scala||1);robot.rotation.y=Math.PI;robot.position.set(0,.6,1.0);g.add(robot);
  prop=oggetto(opt.oggetto,opt.colore);
  if(opt.oggetto==='cuffie'){prop.scale.setScalar(1.55);prop.position.set(0,-.4,0);robot.userData.testa.add(prop)}
  else if(opt.oggetto==='lente'){prop.scale.setScalar(.9);prop.rotation.set(1.2,0,.3);prop.position.set(.02,-.5,.1);robot.userData.braccia[0].gom.add(prop);robot.userData.lente=true}
  else{prop.scale.setScalar(.95);prop.position.set(W/2-.5,H+.05,-.25);prop.rotation.y=-.5;g.add(prop)}}
 g.userData={s1,s2,robot,prop};return g}

// ---------- la 3090 gigante ----------
const GPU={ventole:[],vel:0,rgb:[],gruppo:null};
function faiGPU(x,z){
 const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=-.5;const W=3.4,H=8.0,D=1.7;
 const nero=new THREE.MeshStandardMaterial({color:0x121316,roughness:.38,metalness:.6});
 const argento=new THREE.MeshStandardMaterial({color:0xaeb2ba,roughness:.3,metalness:.95});
 const corpo=rbox(W,H,D,.12,nero);corpo.position.y=H/2+.25;g.add(corpo);
 g.add(box(argento,0,.14,0,W+.5,.28,D+.6));                                   // base del monumento
 const piastra=rbox(W-.25,H-.25,.1,.04,argento);piastra.position.set(0,H/2+.25,-D/2-.01);g.add(piastra);   // backplate
 // lamelle del dissipatore sui fianchi
 for(let i=0;i<34;i++)g.add(box(argento,W/2+.005,.7+i*(H-.9)/34,0,.03,.1,D-.5,false));
 const R=1.18;
 for(let i=0;i<3;i++){const cy=.25+H/2+(i-1)*2.55;
  const sede=cil(new THREE.MeshStandardMaterial({color:0x08090b,roughness:.7}),0,cy,D/2-.06,R+.07,.2,false);sede.rotation.x=Math.PI/2;g.add(sede);
  const an=new THREE.Mesh(new THREE.TorusGeometry(R+.07,.06,10,48),argento);an.position.set(0,cy,D/2+.03);g.add(an);

  const mozzo=cil(nero,0,0,0,.3,.12,false);mozzo.rotation.x=Math.PI/2;v.add(mozzo);
  const logo=cil(argento,0,0,.065,.16,.01,false);logo.rotation.x=Math.PI/2;v.add(logo);
  const pg=new THREE.BoxGeometry(R*.74,R*.36,.035);const pm_=new THREE.MeshStandardMaterial({color:0x26282d,roughness:.35,metalness:.5});
  for(let k=0;k<11;k++){const perno=new THREE.Group();perno.rotation.z=k/11*6.2832;const p=new THREE.Mesh(pg,pm_);p.position.x=R*.6;p.rotation.x=.5;p.rotation.z=.25;perno.add(p);v.add(perno)}
  g.add(v);GPU.ventole.push(v)}
 // strisce RGB
 for(const sx of [-1,1]){const m=new THREE.MeshBasicMaterial({color:0x00d0ff});const s=box(m,sx*(W/2-.1),H/2+.25,D/2+.012,.07,H-.5,.03,false);g.add(s);GPU.rgb.push(m)}
 const mt=new THREE.MeshBasicMaterial({color:0x00d0ff});g.add(box(mt,0,H+.262,0,W-.6,.03,.12,false));GPU.rgb.push(mt);
 // scritta sul fianco (verso il centro della stanza) e sopra le ventole
 const scritta=tela(1536,256,(c,w,h)=>{c.fillStyle='#0d0e11';c.fillRect(0,0,w,h);c.fillStyle='#f2f3f5';c.font='900 78px "Segoe UI",Arial,sans-serif';c.textBaseline='middle';
  c.fillText('ZOTAC',40,74);c.font='600 44px "Segoe UI",Arial,sans-serif';c.fillStyle='#c7cad1';c.fillText('GAMING',330,78);
  c.font='800 104px "Segoe UI",Arial,sans-serif';c.fillStyle='#fff';c.fillText('GeForce RTX 3090',40,180);c.fillStyle='#76b900';c.fillRect(1300,60,180,16)});
 const tg=new THREE.Mesh(new THREE.PlaneGeometry(H-1.2,(H-1.2)/6),new THREE.MeshBasicMaterial({map:scritta,toneMapped:false}));
 tg.position.set(-W/2-.012,H/2+.25,0);tg.rotation.set(0,-Math.PI/2,Math.PI/2,'YXZ');g.add(tg);
 const s2=tela(768,96,(c,w,h)=>{c.fillStyle='#121316';c.fillRect(0,0,w,h);c.fillStyle='#e8eaee';c.font='800 50px "Segoe UI",Arial,sans-serif';c.textBaseline='middle';c.textAlign='center';c.fillText('ZOTAC GAMING · RTX 3090',w/2,h/2+2)});
 const t2=new THREE.Mesh(new THREE.PlaneGeometry(2.6,.325),new THREE.MeshBasicMaterial({map:s2,toneMapped:false}));t2.position.set(0,H-.02,D/2+.012);g.add(t2);
 // staffa e connettori
 g.add(box(argento,0,.55,D/2-.3,W-.4,.12,.9));
 const l=new THREE.PointLight(0x00d0ff,10,8,2);l.position.set(0,4,D/2+1.6);g.add(l);GPU.luce=l;

const posti=[];           // {id,tipo,g,centro,camPos,camTarget,etPos,el,dati}
const etichette=$('#etichette');const pickers=[];
function nuovoPosto(p){const el=document.createElement('div');el.className='et';etichette.appendChild(el);p.el=el;p.etV=new V3();
 const pk=new THREE.Mesh(G.box,new THREE.MeshBasicMaterial({visible:false}));pk.position.copy(p.pickPos);pk.scale.copy(p.pickSize);pk.rotation.y=p.pickRot||0;pk.userData.posto=p;scene.add(pk);pickers.push(pk);p.pk=pk;posti.push(p);return p}
function postoScrivania(id,tipo,x,y,z,ry,opt){
 const g=faiScrivania(opt);g.position.set(x,y,z);g.rotation.y=ry;scene.add(g);g.updateMatrixWorld(true);
 const loc=(lx,ly,lz)=>g.localToWorld(new V3(lx,ly,lz));
 const p={id,tipo,g,opt,etPos:loc(0,(opt.scala||1)*2.05+.85,.95),pickPos:loc(0,1.3,.35),pickSize:new V3(opt.grande?4:3.2,2.7,3),pickRot:ry,
  camPos:loc(2.9,4.1,5.6),camTarget:loc(0,1.45,-.1)};
 return nuovoPosto(p)}
const COL=[-7.2,0,7.2],RIGA0=.2,PASSO=4.4;
let nAgentiFatti=-1;
function costruisciPostazioni(S){
 // toglie le vecchie scrivanie agenti (quando cambia l'elenco)
 for(let i=posti.length-1;i>=0;i--){const p=posti[i];if(p.tipo==='agente'||p.tipo==='libero'){scene.remove(p.g);scene.remove(p.pk);pickers.splice(pickers.indexOf(p.pk),1);p.el.remove();posti.splice(i,1)}}
 const ag=S.agenti||[];const n=Math.max(9,Math.ceil((ag.length+1)/3)*3);   // sempre almeno un posto libero per il prossimo
 const righe=n/3;ST.ZDAVANTI=Math.max(14,RIGA0+(righe-1)*PASSO+5);faiStanza();
 for(let i=0;i<n;i++){const a=ag[i];const x=COL[i%3],z=RIGA0+Math.floor(i/3)*PASSO;
  if(a)postoScrivania(a.id,'agente',x,0,z,0,{colore:a.colore||'#58a6ff',oggetto:a.oggetto});
  else postoScrivania('libero'+i,'libero',x,0,z,0,{colore:'#8b949e',libero:true})}
 nAgentiFatti=ag.map(a=>a.id+a.oggetto+a.colore).join();ombre()}

 faiStanza();faiPalco();
 // Claude sul palco, rivolto verso gli agenti

 // tappeto/corsia verso il palco

// ---------- disegno degli schermi ----------
function carattere(px,peso=600){return `${peso} ${px}px system-ui,"Segoe UI",Roboto,sans-serif`}
function taglia(x,t,max){t=String(t||'');if(x.measureText(t).width<=max)return t;while(t.length>1&&x.measureText(t+'…').width>max)t=t.slice(0,-1);return t+'…'}
function righe(x,t,max,n){const par=String(t||'').split(/\s+/),out=[];let r='';for(const p of par){if(x.measureText(r+' '+p).width>max&&r){out.push(r);r=p;if(out.length==n-1)break}else r=r?r+' '+p:p}
 const resto=par.slice(out.join(' ').split(/\s+/).filter(Boolean).length).join(' ');if(out.length==n-1)out.push(taglia(x,resto,max));else if(r)out.push(r);return out}
function tempo(s){if(s==null)return'';s=Math.max(0,Math.round(s));return s<60?s+' s':s<3600?Math.round(s/60)+' min':Math.floor(s/3600)+' h '+Math.round(s%3600/60)+' min'}
function disegnaSchermi(p){const a=p.dati||{},{s1,s2}=p.g.userData;const col=a.colore||p.opt.colore;
 const W=384,H=232;
 for(const [k,s] of [[1,s1],[2,s2]]){const x=s.x;
  if(p.tipo==='libero'||SPENTO){x.fillStyle='#07090c';x.fillRect(0,0,W,H);if(p.tipo==='libero'&&k==1){x.fillStyle='#2b3440';x.font=carattere(24);x.textAlign='center';x.fillText('Posto libero',W/2,H/2+8);x.textAlign='left'}s.t.needsUpdate=true;continue}
  const err=a.stato==='errore',lav=a.stato==='lavora';
  const g=x.createLinearGradient(0,0,0,H);if(err){g.addColorStop(0,'#7a1410');g.addColorStop(1,'#3a0806')}else if(lav){g.addColorStop(0,'#0f2238');g.addColorStop(1,'#081320')}else{g.addColorStop(0,'#10151d');g.addColorStop(1,'#0a0d12')}
  x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle=err?'#ff6b61':col;x.fillRect(0,0,W,7);
  if(k==1){

function tocca(posto){aperta=posto;disegnaScheda();vola(posto);$('#avviso').style.opacity=0}
$('#bGenerale').onclick=()=>{chiudiScheda();vola(null)};
$('#bRegistro').onclick=()=>{aperta='registro';disegnaScheda()};

// clic / tocco (solo se non si e' trascinato)
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let giu=null;
canvas.addEventListener('pointerdown',e=>{giu={x:e.clientX,y:e.clientY,t:performance.now()}});
canvas.addEventListener('pointerup',e=>{if(!giu)return;const d=Math.hypot(e.clientX-giu.x,e.clientY-giu.y),dt=performance.now()-giu.t;giu=null;if(d>8||dt>600)return;
 mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mouse,camera);
 const h=ray.intersectObjects(pickers,false)[0];if(h)tocca(h.object.userData.posto)});
canvas.addEventListener('pointermove',e=>{if(TOUCH||e.buttons)return;mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mouse,camera);canvas.style.cursor=ray.intersectObjects(pickers,false).length?'pointer':'grab'});
addEventListener('keydown',e=>{if(e.key==='Escape'){chiudiScheda();vola(null)}});

// ---------- ciclo ----------
function misura(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
addEventListener('resize',()=>{misura();if(!aperta||aperta==='registro'){const g=poseGenerale();if(!volo){camera.position.copy(g.p);controls.target.copy(g.t)}}});
const orologio=new THREE.Clock();let raf=0,ultimo=0,tOmbre=0;const v=new V3();
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function giro(ora){raf=requestAnimationFrame(giro);
 if(TOUCH&&ora-ultimo<31)return;ultimo=ora;
 const dt=Math.min(.1,orologio.getDelta()),t=orologio.elapsedTime;
 if(volo){volo.t+=dt/volo.dur;const k=ease(Math.min(1,volo.t));camera.position.lerpVectors(volo.p0,volo.p1,k);camera.position.y+=Math.sin(Math.PI*k)*Math.min(4,volo.p0.distanceTo(volo.p1)*.12);controls.target.lerpVectors(volo.t0,volo.t1,k);camera.lookAt(controls.target);
  if(volo.t>=1){volo=null;controls.enabled=true}}
 else controls.update();
 // ventole: velocita' dal carico vero della GPU
 const uso=SPENTO?0:((S.pc&&S.pc.gpu&&S.pc.gpu.uso)||0);const vv=SPENTO?0:1.2+uso/100*26;GPU.vel+=(vv-GPU.vel)*Math.min(1,dt*1.2);
 GPU.ventole.forEach((f,i)=>f.rotation.z-=GPU.vel*dt*(i==1?1.06:1));
 const temp=(S.pc&&S.pc.gpu&&S.pc.gpu.temp)||40;const tinta=SPENTO?0:temp>84?.0:uso>50?(t*.07)%1:(.52+Math.sin(t*.4)*.05);
 GPU.rgb.forEach(m=>m.color.setHSL(tinta,1,SPENTO?.08:.55));if(GPU.luce){GPU.luce.color.setHSL(tinta,1,.55);GPU.luce.intensity=SPENTO?0:3+uso*.04}
 // robot
 for(const p of posti){const r=p.g&&p.g.userData.robot;if(!r)continue;const u=r.userData,a=p.dati||{},f=u.fase;
  if(a.stato==='lavora'){u.testa.rotation.x=.12+Math.sin(t*1.7+f)*.05;u.testa.rotation.y=Math.sin(t*.9+f)*.22;u.testa.rotation.z=0;
   u.braccia.forEach((b,i)=>{if(u.lente&&i==0){b.sp.rotation.x=-1.25+Math.sin(t*1.3)*.12;b.gom.rotation.x=-1.1;return}b.gom.rotation.x=-1.05+Math.sin(t*13+f+i*2.1)*.13;b.sp.rotation.x=-.55+Math.sin(t*3.1+f+i)*.05});
   u.corpo.scale.y=1}
  else if(a.stato==='errore'){u.testa.rotation.x=.3;u.testa.rotation.y=Math.sin(t*2.2+f)*.3;u.testa.rotation.z=0;u.braccia.forEach(b=>{b.gom.rotation.x=-.4;b.sp.rotation.x=-.1});
   u.occhi.color.setRGB(1,.15+.15*Math.sin(t*6),.12)}
  else{u.testa.rotation.x=.42+Math.sin(t*.8+f)*.04;u.testa.rotation.y=0;u.testa.rotation.z=.12;u.braccia.forEach(b=>{b.gom.rotation.x=-.25;b.sp.rotation.x=-.05});u.corpo.scale.y=1+Math.sin(t*1.2+f)*.015}
  const pr=p.g.userData.prop;if(pr&&pr.userData.gira)pr.userData.gira.rotation.y=t*(a.stato==='lavora'?4:.6)}
 if(t-tOmbre>1.5){tOmbre=t;ombre()}
 renderer.render(scene,camera);
 // etichette
 const w=innerWidth,h=innerHeight;
 for(const p of posti){v.copy(p.etPos).project(camera);const vis=v.z<1&&v.x>-1.1&&v.x<1.1&&v.y>-1.1&&v.y<1.2;
  if(!vis||aperta===p){if(!p.nasc){p.el.style.display='none';p.nasc=true}continue}
  if(p.nasc){p.el.style.display='';p.nasc=false}
  p.el.style.transform=`translate(-50%,-100%) translate(${((v.x+1)/2*w).toFixed(1)}px,${((1-v.y)/2*h).toFixed(1)}px)`}
}
function avvia(){cancelAnimationFrame(raf);orologio.getDelta();raf=requestAnimationFrame(giro)}
document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelAnimationFrame(raf);else{avvia();aggiorna()}});   // pagina non visibile = fermo, niente GPU

// ---------- partenza ----------
function caricaScript(src){return new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}
function parti(){$('#login').style.display='none';aggiorna();setInterval(aggiorna,LOCALE?2000:5000)}
misura();costruisciFissi();costruisciPostazioni(S);
{const g=poseGenerale();camera.position.copy(g.p);controls.target.copy(g.t);controls.update()}
avvia();
if(LOCALE)parti();
else{$('#bApp').style.display='';
 try{await caricaScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js');await caricaScript('config.js');
  const CFG=window.CRM_CONFIG;sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
  $('#lgForm').onsubmit=async ev=>{ev.preventDefault();$('#lg_err').textContent='';const {error}=await sb.auth.signInWithPassword({email:$('#lg_email').value.trim(),password:$('#lg_pw').value});
   if(error){$('#lg_err').textContent='Email o password errate';return}parti()};
  const {data}=await sb.auth.getSession();if(data.session)parti();else{$('#login').style.display='grid';$('#carica').remove()}
 }catch(e){$('#carica').textContent='Non riesco a collegarmi: controlla la connessione.'}}
</script>
