<title>Ufficio 3D · Leoni Studio</title>
<style>
:root{--bg:#0d1117;--panel:rgba(18,23,31,.86);--line:rgba(255,255,255,.12);--txt:#e6edf3;--mut:#8b949e;--acc:#f5b301;--ok:#3fb950;--err:#f85149}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#222a44 0%,#131827 55%,#090c13 100%);color:var(--txt);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
header{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;pointer-events:none}
header>*{pointer-events:auto}
.logo{font-weight:800;letter-spacing:.06em;font-size:15px;margin-right:auto;text-shadow:0 1px 8px #000}
.logo b{color:var(--acc)}
.pill{padding:5px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:12.5px;backdrop-filter:blur(8px);white-space:nowrap}
.pill.ok{color:var(--ok)}.pill.err{color:var(--err)}
#att{display:none;cursor:pointer;color:#fff;background:rgba(190,40,30,.9);border-color:#ff8a80;animation:batte 1.6s infinite}
button,a.btn{font:inherit;color:var(--txt);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;backdrop-filter:blur(8px);text-decoration:none;display:inline-block}
button:hover,a.btn:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:#111;border-color:var(--acc);font-weight:700}
button.on{border-color:var(--acc);color:var(--acc)}
#etichette{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.et{position:absolute;left:0;top:0;transform:translate(-50%,-100%);padding:4px 9px;border-radius:10px;background:rgba(13,17,23,.78);border:1px solid var(--line);font-size:12px;white-space:nowrap;max-width:240px;text-align:center;will-change:transform}
.et b{display:block;font-size:12.5px}
.et span{display:block;color:var(--mut);overflow:hidden;text-overflow:ellipsis;font-size:11.5px}
.et.lavora{min-width:178px;max-width:250px;padding:8px 11px 9px;border-radius:16px;text-align:left;background:linear-gradient(135deg,rgba(255,255,255,.26),rgba(255,255,255,.07) 45%,rgba(255,255,255,.14));border:1px solid rgba(255,255,255,.42);
 box-shadow:0 10px 30px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -8px 16px rgba(255,255,255,.05);backdrop-filter:blur(16px) saturate(170%);-webkit-backdrop-filter:blur(16px) saturate(170%);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.et.lavora b{font-size:13px}.et.lavora b::before{content:"● ";color:var(--col,#58a6ff);animation:batte 1.1s infinite}
.et.lavora span{color:#f1f5fa}
.et .bar{height:7px;border-radius:7px;background:rgba(0,0,0,.35);margin:6px 0 4px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.et .bar i{display:block;height:100%;width:0;border-radius:7px;background:linear-gradient(90deg,var(--col,#58a6ff),#fff);transition:width 1s linear}
.et .bar.indet i{width:38%;animation:scorre 1.6s ease-in-out infinite}
@keyframes scorre{0%{margin-left:-38%}100%{margin-left:100%}}
.et .tm{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;font-variant-numeric:tabular-nums;color:#fff}
.et .tm em{font-style:normal;color:#ffe08a}
#musica{position:fixed;z-index:9;right:12px;top:calc(58px + env(safe-area-inset-top));width:min(300px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;backdrop-filter:blur(14px);display:none}
#musica.su{display:block}#musica label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
#musica select,#musica input[type=range]{width:100%}#musica select{padding:8px;border-radius:8px;background:#0a0e13;color:var(--txt);border:1px solid var(--line);font:inherit}
#musica .ora{font-size:13px;margin-top:8px;min-height:18px}
.et.errore{border-color:var(--err);background:rgba(70,14,14,.88)}.et.errore span{color:#ffb4ae}
.et.libero{opacity:.55}
@keyframes batte{50%{opacity:.35}}
#scheda{position:fixed;z-index:6;right:12px;top:calc(58px + env(safe-area-inset-top));width:min(380px,calc(100vw - 24px));max-height:calc(100vh - 80px);max-height:calc(100dvh - 80px);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;backdrop-filter:blur(14px);transform:translateX(calc(100% + 24px));transition:transform .35s cubic-bezier(.2,.8,.2,1);user-select:text;-webkit-user-select:text}
#scheda.su{transform:none}
#scheda.largo{width:min(560px,calc(100vw - 24px))}
.vplayer{width:100%;max-height:60vh;border-radius:12px;background:#000;display:block;margin:8px 0}
#scheda textarea{width:100%;min-height:92px;margin-top:10px;padding:10px;border-radius:10px;border:1px solid var(--line);background:#0a0e13;color:var(--txt);font:inherit;font-size:15px}
.azioni button{padding:7px 11px;font-size:13.5px}
.vwrap{position:relative}
.vcanvas{position:absolute;display:none;touch-action:none;cursor:crosshair;border-radius:8px;box-shadow:0 0 0 2px #ff3b30,0 0 18px rgba(255,59,48,.5)}
.vwrap.dis .vcanvas{display:block}
.vbar{position:relative;height:20px;margin:-2px 0 8px;border-radius:10px;background:rgba(255,255,255,.09);overflow:hidden;cursor:pointer;touch-action:none}
.vseg{position:absolute;top:3px;bottom:3px;min-width:7px;background:#f5b301;border-radius:4px}.vseg.bz{background:#58a6ff}
.vtesta{position:absolute;top:0;bottom:0;width:2px;background:#fff;pointer-events:none}
.nota{margin-top:8px;padding:9px 10px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:13.5px}
.nota.bz{border-color:rgba(88,166,255,.55)}
.nota audio{width:100%;height:36px;margin-top:6px;display:block}
.nota img{height:84px;border-radius:6px;background:#10141b;margin-top:6px;border:1px solid var(--line);display:block}
.nota .via{float:right;padding:2px 8px;font-size:12px}
.tchip{display:inline-block;padding:2px 9px;border-radius:999px;background:rgba(245,179,1,.18);border:1px solid rgba(245,179,1,.5);font-size:12.5px;font-weight:700;cursor:pointer;margin-right:6px;font-variant-numeric:tabular-nums}
.ntempo{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.penne{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0 8px}
.col{width:32px;height:32px;border-radius:50%;padding:0;border:3px solid transparent}.col.on{border-color:#fff}
button.rec{background:#c62828;color:#fff;border-color:#ff8a80;animation:batte 1s infinite}
button.stop{border-color:rgba(248,81,73,.6);color:#ff8a80}
#vid{display:none;cursor:pointer;color:#111;background:var(--acc);border-color:var(--acc);font-weight:700}
.pcbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}
.pcbar button{padding:6px 10px;font-size:13px}
.pcpath{font-size:12.5px;color:var(--mut);word-break:break-all;margin-bottom:8px}
.pccart{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pccart div{padding:7px 10px;border-radius:9px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:13px;cursor:pointer}
.pccart div:hover{border-color:var(--acc)}
.pcvid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pcv{position:relative;border-radius:10px;overflow:hidden;border:2px solid transparent;background:#0a0e13;cursor:pointer}
.pcv.on{border-color:#11f401}
.pcv video,.pcv img,.pcv .vuoto{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#000}
.pcv .n{font-size:11.5px;padding:5px 7px 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcv .d{font-size:10.5px;color:var(--mut);padding:0 7px 6px}
.pcv .k{position:absolute;right:6px;top:6px;width:24px;height:24px;border-radius:50%;background:#11f401;color:#000;font-weight:800;display:none;place-items:center}
.pcv.on .k{display:grid}
.pcfoot{position:sticky;bottom:-16px;margin:12px -16px -16px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(18,23,31,.97);border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pcesito{margin-top:10px;padding:10px 12px;border-radius:10px;background:rgba(17,244,1,.08);border:1px solid rgba(17,244,1,.35);font-size:13.5px}
.pcesito.err{background:rgba(248,81,73,.12);border-color:rgba(248,81,73,.4)}
.pcesito select{padding:7px;border-radius:8px;background:#0a0e13;color:var(--txt);border:1px solid var(--line);font:inherit;max-width:100%}
#scheda h2{margin:0 0 2px;font-size:19px;padding-right:36px}
#scheda .ruolo{color:var(--mut);font-size:13px;margin-bottom:10px}
#scheda .x{position:absolute;right:10px;top:10px;padding:4px 10px;border-radius:8px}
.chip{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;background:#1c2633;color:var(--mut)}
.chip.lavora{background:rgba(63,185,80,.18);color:var(--ok)}.chip.errore{background:rgba(248,81,73,.2);color:var(--err)}
.cosa{font-size:15.5px;margin:10px 0 6px}
.barra{height:9px;border-radius:9px;background:#1c2633;overflow:hidden;margin:6px 0}
.barra i{display:block;height:100%;background:var(--acc);border-radius:9px;transition:width .6s}
.mut{color:var(--mut);font-size:12.5px}
.perche{margin-top:10px;padding:9px 11px;border-radius:10px;background:rgba(245,179,1,.1);border:1px solid rgba(245,179,1,.3);font-size:13.5px}
.perche b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin-bottom:2px}
.avv{margin:6px 0;padding:9px 11px;border-radius:10px;background:rgba(248,81,73,.14);border:1px solid rgba(248,81,73,.4);font-size:13.5px}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:16px 0 6px}
.riga{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px}
.riga span:last-child{color:var(--mut);white-space:nowrap}
.riga.err span:first-child{color:#ffb4ae}.riga.ok span:first-child{color:#9be9a8}.riga.ora span:first-child{color:#ffd66b;font-weight:700}
.dati{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dato{background:rgba(255,255,255,.05);border-radius:10px;padding:8px 10px}
.dato b{display:block;font-size:19px}.dato small{color:var(--mut)}
.azioni{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
canvas.graf{width:100%;height:auto;border-radius:10px;background:rgba(255,255,255,.04);margin-top:4px;display:block}
#login{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;place-items:center}
#login form{width:min(360px,90vw);background:#12171f;border:1px solid var(--line);border-radius:16px;padding:26px;display:flex;flex-direction:column;gap:12px}
#login input{padding:12px;border-radius:10px;border:1px solid var(--line);background:#0a0e13;color:var(--txt);font:inherit;font-size:16px}
#avviso{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:7;padding:9px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:13px;max-width:92vw;text-align:center;backdrop-filter:blur(8px);transition:opacity .4s;pointer-events:none}
#carica{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:var(--bg);font-size:16px;transition:opacity .5s}
/* prima persona */
#joy{position:fixed;left:calc(22px + env(safe-area-inset-left));bottom:calc(26px + env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid var(--line);z-index:8;display:none;touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:rgba(245,179,1,.85);box-shadow:0 2px 12px #0008}
#azFP{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:8;display:none}
#mirino{position:fixed;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;background:rgba(255,255,255,.7);z-index:3;display:none;pointer-events:none}
body.fp #joy.touch{display:block}body.fp #mirino{display:block}
@media (max-width:640px){
 #scheda{right:0;left:0;top:auto;bottom:0;width:100%;max-height:52vh;max-height:60dvh;border-radius:18px 18px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom));transform:translateY(105%)}
 .et{font-size:11px;padding:3px 7px}.et span{display:none}.et.errore span{display:block;max-width:120px}.et.lavora{min-width:120px;padding:5px 8px 6px}.et.lavora .tm{display:flex;font-size:10.5px}.et.lavora .tm span{display:inline}
 .logo{font-size:13px;flex-basis:100%}
 #scheda.largo{max-height:82vh}
 button,a.btn{padding:7px 10px;font-size:13px}
}
</style>

 sfera.center.set(THOR.pos.x,.7,THOR.pos.z);sfera.radius=.95;if(THOR.g&&ray.ray.intersectsSphere(sfera)){$('#musica').classList.remove('su');aperta='thor';THOR.festa=2.2;disegnaScheda();if(!FP.on)vola({camPos:new V3(THOR.pos.x-3.2,3,THOR.pos.z+4.6),camTarget:new V3(THOR.pos.x,.8,THOR.pos.z)});return}
 let h=null;for(const p of posti){if(!p.bot||(p.bot.dove==='scrivania'&&p.bot.modo==='fermo'))continue;const r=p.robot.position;sfera.center.set(r.x,r.y+.9,r.z);sfera.radius=1.15;if(ray.ray.intersectsSphere(sfera)){h=p;break}}

function misura(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}

const orologio=new THREE.Clock();let raf=0,ultimo=0,tOmbre=0,tGioco=0;const v=new V3();
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function giro(ora){raf=requestAnimationFrame(giro);
 if(ora-ultimo<((TOUCH||FP.on||volo||document.hasFocus())?31:80))return;ultimo=ora;   // 30 al secondo; 12 se la finestra non e' in primo piano
 const dt=Math.min(.1,orologio.getDelta()),t=orologio.elapsedTime;
 if(FP.on)muoviFP(dt);
 else if(volo){volo.t+=dt/volo.dur;const k=ease(Math.min(1,volo.t));camera.position.lerpVectors(volo.p0,volo.p1,k);camera.position.y+=Math.sin(PI*k)*Math.min(4,volo.p0.distanceTo(volo.p1)*.12);controls.target.lerpVectors(volo.t0,volo.t1,k);camera.lookAt(controls.target);
  if(volo.t>=1){volo=null;controls.enabled=true}}
 else controls.update();
 const uso=SPENTO?0:((S.pc&&S.pc.gpu&&S.pc.gpu.uso)||0);const vv=SPENTO?0:1.2+uso/100*26;GPU.vel+=(vv-GPU.vel)*Math.min(1,dt*1.2);
 GPU.ventole.forEach((f,i)=>f.rotation.z-=GPU.vel*dt*(i==1?1.06:1));
 const temp=(S.pc&&S.pc.gpu&&S.pc.gpu.temp)||40;const tinta=SPENTO?0:temp>84?.0:uso>50?(t*.07)%1:(.52+Math.sin(t*.4)*.05);
 GPU.rgb.forEach(m=>m.color.setHSL(tinta,1,SPENTO?.08:.55));if(GPU.luce){GPU.luce.color.setHSL(tinta,1,.55);GPU.luce.intensity=SPENTO?0:3+uso*.04}
 let cammina=false;
 for(const p of posti){const L=p.g&&p.g.userData.lampada;if(L&&Math.abs(L.v-L.obb)>.004){L.v+=(L.obb-L.v)*Math.min(1,dt*4);L.pmat.emissive.set(L.rossa?0xff3020:0xffb347);L.pmat.emissiveIntensity=L.v*2.6;L.al.material.opacity=L.v*.75;L.al.material.color.set(L.rossa?0xff5040:0xffc070);L.lt.material.opacity=L.v*.5;L.anello.material.opacity=L.v*(L.rossa?.7:.62);if(L.rossa)L.anello.material.color.set(0xff3020)}
  if(!p.robot)continue;animaRobot(p,dt,t);if(p.bot&&p.bot.modo==='cammina')cammina=true;const pr=p.g.userData.prop;if(pr&&pr.userData.gira)pr.userData.gira.rotation.y=t*((p.dati||{}).stato==='lavora'?4:.6)}
 animaThor(dt,t);
 if(t-tGioco>.25){tGioco=t;disegnaGioco(t)}
 if(t-tOmbre>(cammina?.1:1.5)){tOmbre=t;ombre()}
 renderer.render(scene,camera);
 const w=innerWidth,h=innerHeight;
 if(THOR.el){v.copy(THOR.etV).project(camera);const vis=v.z<1&&Math.abs(v.x)<1.1&&Math.abs(v.y)<1.15&&aperta!=='thor';THOR.el.style.display=vis?'':'none';if(vis)THOR.el.style.transform=`translate(-50%,-100%) translate(${((v.x+1)/2*w).toFixed(1)}px,${((1-v.y)/2*h).toFixed(1)}px)`}
 for(const p of posti){v.copy(p.etPos).project(camera);const vis=v.z<1&&v.x>-1.1&&v.x<1.1&&v.y>-1.1&&v.y<1.2&&!(FP.on&&camera.position.distanceTo(p.etPos)>26);
  if(!vis||aperta===p){if(!p.nasc){p.el.style.display='none';p.nasc=true}continue}
  if(p.nasc){p.el.style.display='';p.nasc=false}
  p.el.style.transform=`translate(-50%,-100%) translate(${((v.x+1)/2*w).toFixed(1)}px,${((1-v.y)/2*h).toFixed(1)}px)`}
}
function avvia(){cancelAnimationFrame(raf);orologio.getDelta();raf=requestAnimationFrame(giro)}
document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelAnimationFrame(raf);else{avvia();aggiorna()}});   // pagina non visibile = fermo, niente GPU

function parti(){$('#login').style.display='none';aggiorna();setInterval(aggiorna,LOCALE?2000:5000)}
misura();costruisciFissi();costruisciPostazioni(S);
{const g=poseGenerale();camera.position.copy(g.p);controls.target.copy(g.t);controls.update()}
avvia();
if(LOCALE)parti();
else{$('#bApp').style.display='';
 try{await caricaScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js');await caricaScript('config.js');
  const CFG=window.CRM_CONFIG;sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
  $('#lgForm').onsubmit=async ev=>{ev.preventDefault();$('#lg_err').textContent='';const {error}=await sb.auth.signInWithPassword({email:$('#lg_email').value.trim(),password:$('#lg_pw').value});
   if(error){$('#lg_err').textContent='Email o password errate';return}parti()};
  const {data}=await sb.auth.getSession();if(data.session)parti();else{$('#login').style.display='grid';$('#carica').remove()}
 }catch(e){$('#carica').textContent='Non riesco a collegarmi: controlla la connessione.'}}
